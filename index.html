<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad++ | Notes & Diagram Notebook</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#181825" />
  <meta name="description" content="Clean, seamless Notepad with Jupyter-style notes and canvas/image diagram blocks." />
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="theme-dark">
  <div id="app" class="app-container">
    <!-- Clean Minimalist Top Bar (Title & Menus) -->
    <header class="top-bar">
      <div class="window-controls">
        <span class="control-dot close"></span>
        <span class="control-dot minimize"></span>
        <span class="control-dot maximize"></span>
      </div>

      <div class="app-branding">
        <img src="/icon.svg" alt="Notepad++" class="app-logo" />
        <span class="app-title">Notepad++</span>
      </div>

      <!-- Compact Menus -->
      <nav class="menu-bar">
        <div class="menu-item" data-menu="file">
          <span>File</span>
          <div class="dropdown-menu">
            <button id="menu-open-file"><span class="icon">📂</span> Open File... <span class="shortcut">Ctrl+O</span></button>
            <button id="menu-save-file"><span class="icon">💾</span> Save <span class="shortcut">Ctrl+S</span></button>
            <button id="menu-save-as"><span class="icon">📥</span> Save As... <span class="shortcut">Ctrl+Shift+S</span></button>
            <div class="menu-separator"></div>
            <button id="menu-export-markdown"><span class="icon">📝</span> Export as Markdown (.md)</button>
            <button id="menu-close-tab"><span class="icon">✕</span> Close Tab <span class="shortcut">Ctrl+W</span></button>
          </div>
        </div>

        <div class="menu-item" data-menu="insert">
          <span>Insert</span>
          <div class="dropdown-menu">
            <button id="menu-insert-note"><span class="icon">📝</span> Add Note Section</button>
            <button id="menu-insert-diagram"><span class="icon">📊</span> Add Diagram Section</button>
          </div>
        </div>

        <div class="menu-item" data-menu="edit">
          <span>Edit</span>
          <div class="dropdown-menu">
            <button id="menu-undo"><span class="icon">↩️</span> Undo <span class="shortcut">Ctrl+Z</span></button>
            <button id="menu-redo"><span class="icon">↪️</span> Redo <span class="shortcut">Ctrl+Y</span></button>
            <div class="menu-separator"></div>
            <button id="menu-find"><span class="icon">🔍</span> Find <span class="shortcut">Ctrl+F</span></button>
          </div>
        </div>
      </nav>

      <!-- Clean Top-Right Actions -->
      <div class="top-actions">
        <span id="autosave-indicator" class="autosave-badge saved">● Saved</span>
        <button id="btn-theme-toggle" class="btn-icon" title="Toggle Dark/Light Mode">
          <span class="theme-icon">🌙</span>
        </button>
        <button id="btn-google-auth" class="btn-icon" title="Cloud Sync">
          <span>☁️</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Layout with Vertical Activity Bar -->
    <div class="main-body-layout">
      <!-- Vertical Activity Bar (VS Code / Antigravity IDE style) -->
      <aside class="activity-bar">
        <div class="activity-group top">
          <button id="act-add-note" class="activity-btn" title="Add Note Section">
            <span class="act-icon">📝</span>
            <span class="act-label">+ Note</span>
          </button>
          <button id="act-add-diagram" class="activity-btn" title="Add Diagram / Image Section">
            <span class="act-icon">📊</span>
            <span class="act-label">+ Diagram</span>
          </button>
          <div class="activity-divider"></div>
          <button id="act-open" class="activity-btn" title="Open File (Ctrl+O)">
            <span class="act-icon">📂</span>
            <span class="act-label">Open</span>
          </button>
          <button id="act-save" class="activity-btn" title="Save Document (Ctrl+S)">
            <span class="act-icon">💾</span>
            <span class="act-label">Save</span>
          </button>
          <button id="act-find" class="activity-btn" title="Find in Document (Ctrl+F)">
            <span class="act-icon">🔍</span>
            <span class="act-label">Find</span>
          </button>
        </div>

        <div class="activity-group bottom">
          <button id="act-theme" class="activity-btn" title="Toggle Theme">
            <span class="act-icon">🌓</span>
          </button>
        </div>
      </aside>

      <!-- Right Content Workspace -->
      <div class="workspace-area">
        <!-- Flush, Seamless Tabs Container -->
        <div class="tabs-container">
          <div id="tabs-list" class="tabs-list">
            <!-- Rendered dynamically -->
          </div>
          <button id="btn-add-tab" class="btn-add-tab" title="New Tab (Ctrl+N)">+</button>
        </div>

        <!-- Search Bar (Ctrl+F) -->
        <div id="find-replace-panel" class="find-replace-panel hidden">
          <div class="find-row">
            <input type="text" id="find-input" placeholder="Find in document..." />
            <span id="find-count" class="find-count"></span>
            <button id="btn-find-prev" class="btn-sm" title="Previous match (Shift+Enter)">▲</button>
            <button id="btn-find-next" class="btn-sm" title="Next match (Enter)">▼</button>
            <button id="btn-close-find" class="btn-close-find" title="Close (Escape)">✕</button>
          </div>
        </div>

        <!-- Seamless Notepad Document Area -->
        <main class="notepad-scroll-container">
          <div class="notepad-inner">
            <div class="notebook-document-header">
              <h1 id="notebook-doc-title" class="notebook-title" contenteditable="true" spellcheck="false">quick-notes</h1>
            </div>

            <!-- Seamless Sections Container -->
            <div id="sections-container" class="sections-container">
              <!-- Rendered dynamically -->
            </div>

            <!-- Bottom Seamless Add Section Buttons -->
            <div class="notebook-bottom-actions">
              <button id="btn-bottom-add-note" class="btn-seamless-add">
                <span class="icon">📝</span> + Note Section
              </button>
              <button id="btn-bottom-add-diagram" class="btn-seamless-add">
                <span class="icon">📊</span> + Diagram / Canvas Section
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="status-bar">
      <div class="status-left">
        <span id="status-cursor" class="status-item">Ln 1, Col 1</span>
        <span id="status-sections" class="status-item">Sections: 1</span>
        <span id="status-length" class="status-item">Length: 0</span>
      </div>
      <div class="status-right">
        <span class="status-item">UTF-8</span>
        <span class="status-item">Windows (CR LF)</span>
      </div>
    </footer>

    <!-- Hidden file inputs -->
    <input type="file" id="file-input" style="display: none;" />
    <input type="file" id="diagram-image-input" accept="image/*,.svg" style="display: none;" />

    <!-- Google Cloud Sync Modal -->
    <div id="modal-cloud-sync" class="modal-backdrop hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3>☁️ Google Cloud Sync</h3>
          <button id="btn-close-modal" class="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <p>Your notes and tabs are automatically backed up to your local storage and can be synced across browsers.</p>
          <div class="sync-actions" style="margin-top: 16px;">
            <button id="btn-sync-now" class="btn-primary">Force Backup Now</button>
            <button id="btn-mock-google-login" class="btn-secondary">Link Google Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
